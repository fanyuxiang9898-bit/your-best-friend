name: Build and interaction tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:unit
      - run: corepack pnpm validate
      - run: corepack pnpm build:web
        env:
          NODE_ENV: production
          TARO_ENV: h5
      - run: corepack pnpm build:weapp
        env:
          NODE_ENV: production
          TARO_ENV: weapp
      - run: corepack pnpm build:tt
        env:
          NODE_ENV: production
          TARO_ENV: tt
      - run: corepack pnpm build:server
      - run: corepack pnpm audit --prod --audit-level=high
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: node tests/browser.cjs
